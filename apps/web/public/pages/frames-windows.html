<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Frames &amp; Windows</title><link rel="stylesheet" href="/css/styles.css"/></head>
<body>
  <nav class="nav"><div class="nav-links"><a href="/" class="nav-brand">UI Interactions</a><a href="/pages/basic-clicks.html">Clicks</a><a href="/pages/text-input.html">Text Input</a><a href="/pages/form-controls.html">Forms</a><a href="/pages/keyboard-mouse.html">Keyboard</a><a href="/pages/dialogs.html">Dialogs</a><a href="/pages/frames-windows.html">Frames</a><a href="/pages/dynamic-content.html">Dynamic</a><a href="/pages/file-operations.html">Files</a><a href="/pages/clipboard.html">Clipboard</a></div></nav>
  <div class="container">
    <div class="page-header"><h1>Frames &amp; Windows</h1><p>Working with iframes, nested frames, new tabs, and popup windows.</p></div>

    <div class="section"><h2>Iframe</h2>
      <div class="iframe-container"><iframe data-testid="simple-iframe" src="/pages/iframe-content.html" width="100%" height="160" style="border:none" title="Simple iframe"></iframe></div></div>

    <div class="section"><h2>Nested Iframe</h2>
      <div class="iframe-container">
        <iframe data-testid="outer-iframe" src="/pages/outer-iframe-content.html" width="100%" height="160" style="border:none" title="Outer iframe"></iframe>
      </div></div>

    <div class="section"><h2>New Tab / Window</h2>
      <div class="flex gap-md" style="flex-wrap:wrap">
        <a href="/pages/popup.html" target="_blank" data-testid="new-tab-link">Open in New Tab</a>
        <button data-testid="popup-btn" onclick="window.open('/pages/popup.html','popup','width=400,height=300');document.querySelector('[data-testid=popup-output]').textContent='Popup opened'">Open Popup Window</button></div>
      <div class="output" data-testid="popup-output">Click a button to open a new window</div></div>

    <div class="section"><h2>Cross-Frame Communication</h2>
      <div class="form-group"><label>Send message to iframe:</label>
        <div class="flex gap-sm"><input type="text" data-testid="message-input" placeholder="Type a message..." style="max-width:250px"/>
          <button data-testid="send-message-btn" onclick="sendMsg()">Send</button></div></div>
      <div class="iframe-container mt-md" id="msg-iframe-container"></div></div>
  </div>
  <script>

    // Message iframe
    const msgDoc = `<html><head><style>body{font-family:system-ui;background:#1a1d27;color:#e1e4ed;padding:0.75rem;margin:0}.output{background:#0f1117;border:1px solid #2e3345;border-radius:6px;padding:0.5rem;font-family:monospace;font-size:0.8rem;color:#34d399}</style></head><body><div class="output" data-testid="received-message">Waiting for message...</div><script>window.addEventListener("message",(e)=>{document.querySelector("[data-testid=received-message]").textContent="Received: "+e.data});<\/script></body></html>`;
    const msgIframe = document.createElement('iframe');
    msgIframe.setAttribute('data-testid', 'message-iframe');
    msgIframe.setAttribute('width', '100%');
    msgIframe.setAttribute('height', '60');
    msgIframe.style.border = 'none';
    msgIframe.title = 'Message iframe';
    msgIframe.srcdoc = msgDoc;
    document.getElementById('msg-iframe-container').appendChild(msgIframe);

    function sendMsg() {
      const msg = document.querySelector('[data-testid=message-input]').value;
      document.querySelector('[data-testid=message-iframe]').contentWindow.postMessage(msg, '*');
    }
  </script>
</body>
</html>
