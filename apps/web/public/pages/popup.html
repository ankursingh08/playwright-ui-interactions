<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><title>Popup Page</title><link rel="stylesheet" href="/css/styles.css"/></head>
<body>
  <div class="container">
    <div class="page-header"><h1>Popup Window</h1><p>This page was opened in a new tab or popup.</p></div>
    <div class="section"><h2>Popup Content</h2>
      <p data-testid="popup-message">Hello from the popup!</p>
      <button data-testid="popup-close-btn" onclick="window.close()">Close Popup</button></div>
  </div>
</body>
</html>
